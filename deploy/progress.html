// ══════════════════════════════════════════════
// State
// ══════════════════════════════════════════════
const STORAGE_KEY = 'zeju-progress';
let state = loadState();
let personaId = null;

function defaultState() {
    const steps = {};
    Object.keys(STEPS).forEach(id => {
        steps[id] = { status: 'not_started', notes: '', updatedAt: null };
    });
    return { version: 1, startedAt: new Date().toISOString().slice(0,10), steps };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
    } catch(e) {}
    return defaultState();
}

function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadPersona() {
    try {
        const quiz = JSON.parse(localStorage.getItem('quizResultV2') || '{}');
        if (quiz.persona && PERSONAS[quiz.persona]) {
            personaId = quiz.persona;
        }
    } catch(e) {}
}

// ══════════════════════════════════════════════
// Render
// ══════════════════════════════════════════════
function render() {
    loadPersona();
    renderPersonaBanner();
    renderSummary();
    renderPath();
}

function renderPersonaBanner() {
    const banner = document.getElementById('personaBanner');
    const cta = document.getElementById('quizCta');
    if (personaId) {
        const p = PERSONAS[personaId];
        document.getElementById('bannerPersonaTitle').textContent = p.title;
        document.getElementById('bannerPersonaHint').textContent = p.hint;
        banner.classList.add('visible');
        cta.style.display = 'none';
    } else {
        banner.classList.remove('visible');
        cta.style.display = 'block';
    }
}

function renderSummary() {
    let clear = 0, thinking = 0, notStarted = 0;
    Object.values(state.steps).forEach(s => {
        if (s.status === 'clear') clear++;
        else if (s.status === 'thinking') thinking++;
        else notStarted++;
    });
    document.getElementById('countClear').textContent = clear;
    document.getElementById('countThinking').textContent = thinking;
    document.getElementById('countRemaining').textContent = notStarted;
}

function getPhaseStatus(phase) {
    const statuses = phase.steps.map(id => state.steps[id].status);
    if (statuses.every(s => s === 'clear')) return 'done';
    if (statuses.every(s => s === 'not_started')) return 'not-started';
    return 'in-progress';
}

function getPhaseLabel(status) {
    if (status === 'done') return '想清楚了';
    if (status === 'in-progress') return '正在這個階段';
    return '還沒走到';
}

function renderPath() {
    const map = document.getElementById('pathMap');
    map.innerHTML = '';

    PHASES.forEach((phase, pi) => {
        const phaseStatus = getPhaseStatus(phase);

        // Phase section
        const section = document.createElement('div');
        section.className = 'phase-section';
        section.id = 'phase-' + phase.id;

        // Auto-open if in progress
        if (phaseStatus === 'in-progress') section.classList.add('open');

        // Phase header
        section.innerHTML = `
            <div class="phase-header" onclick="togglePhase('${phase.id}')">
                <div class="phase-icon" style="background: ${phase.color}15; color: ${phase.color};">${phase.icon}</div>
                <div class="phase-info">
                    <div class="phase-name">${phase.name}</div>
                    <div class="phase-meta">STEP ${phase.steps[0]}–${phase.steps[phase.steps.length-1]}</div>
                </div>
                <span class="phase-status ${phaseStatus}">${getPhaseLabel(phaseStatus)}</span>
                <span class="phase-chevron">▾</span>
            </div>
            <div class="phase-steps" id="steps-${phase.id}"></div>
        `;

        map.appendChild(section);

        // Step cards
        const stepsContainer = section.querySelector('.phase-steps');
        phase.steps.forEach(stepId => {
            const step = STEPS[stepId];
            const stepState = state.steps[stepId];
            const card = document.createElement('div');
            card.className = 'step-card';
            card.id = 'step-' + stepId;
            card.dataset.status = stepState.status;

            // Persona tip
            let tipHtml = '';
            if (personaId && PERSONAS[personaId].tips[stepId]) {
                tipHtml = `<div class="persona-tip visible">${PERSONAS[personaId].tips[stepId]}</div>`;
            }

            // Dependency hint
            let depHtml = '';
            if (DEP_HINTS[stepId]) {
                const depSteps = DEPENDENCIES[stepId] || [];
                const anyDepDone = depSteps.some(d => state.steps[d].status === 'clear');
                const showDep = stepState.status !== 'clear' && !anyDepDone;
                depHtml = `<div class="dep-hint ${showDep ? 'visible' : ''}">${DEP_HINTS[stepId]}</div>`;
            }

            card.innerHTML = `
                <div class="step-top">
                    <div class="step-num">${stepId}</div>
                    <div class="step-content">
                        <div class="step-title">${step.name}</div>
                        <div class="step-desc">${step.desc}</div>
                    </div>
                </div>
                <div class="status-switcher">
                    <button class="status-btn ${stepState.status === 'not_started' ? 'active-not_started' : ''}"
                            onclick="setStatus('${stepId}','not_started')">尚未面對</button>
                    <button class="status-btn ${stepState.status === 'thinking' ? 'active-thinking' : ''}"
                            onclick="setStatus('${stepId}','thinking')">正在想</button>
                    <button class="status-btn ${stepState.status === 'clear' ? 'active-clear' : ''}"
                            onclick="setStatus('${stepId}','clear')">想清楚了</button>
                </div>
                <div class="step-notes-area">
                    <textarea class="step-notes"
                              placeholder="${step.placeholder}"
                              oninput="saveNotes('${stepId}', this.value)">${stepState.notes}</textarea>
                    ${tipHtml}
                    ${depHtml}
                </div>
                <a href="step/${stepId}.html" class="step-link">閱讀這一步的完整內容 →</a>
            `;

            stepsContainer.appendChild(card);
        });

        // Phase connector (except last)
        if (pi < PHASES.length - 1) {
            const connector = document.createElement('div');
            connector.className = 'phase-connector';
            connector.innerHTML = '<svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0 L8 8 M4 12 L8 18 L12 12" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>';
            map.appendChild(connector);
        }
    });
}

// ══════════════════════════════════════════════
// Actions
// ══════════════════════════════════════════════
function setStatus(stepId, status) {
    state.steps[stepId].status = status;
    state.steps[stepId].updatedAt = new Date().toISOString();
    saveState();

    // Update card
    const card = document.getElementById('step-' + stepId);
    card.dataset.status = status;

    // Update status buttons
    card.querySelectorAll('.status-btn').forEach(btn => {
        btn.className = 'status-btn';
    });
    const buttons = card.querySelectorAll('.status-btn');
    const idx = ['not_started','thinking','clear'].indexOf(status);
    if (idx >= 0) buttons[idx].classList.add('active-' + status);

    // Update phase status
    const phase = PHASES.find(p => p.steps.includes(stepId));
    if (phase) {
        const phaseStatus = getPhaseStatus(phase);
        const section = document.getElementById('phase-' + phase.id);
        const statusEl = section.querySelector('.phase-status');
        statusEl.className = 'phase-status ' + phaseStatus;
        statusEl.textContent = getPhaseLabel(phaseStatus);
    }

    renderSummary();
}

function saveNotes(stepId, value) {
    state.steps[stepId].notes = value;
    state.steps[stepId].updatedAt = new Date().toISOString();
    saveState();
}

function togglePhase(phaseId) {
    const section = document.getElementById('phase-' + phaseId);
    section.classList.toggle('open');
}

function expandAll() {
    const allOpen = document.querySelectorAll('.phase-section:not(.open)').length === 0;
    document.querySelectorAll('.phase-section').forEach(s => {
        if (allOpen) s.classList.remove('open');
        else s.classList.add('open');
    });
    // Update button text
    const btn = document.querySelector('.toolbar-btn.primary');
    btn.textContent = allOpen ? '展開全部' : '收合全部';
}

// ══════════════════════════════════════════════
// Export / Import
// ══════════════════════════════════════════════
function exportProgress() {
    try {
        const data = JSON.stringify(state);
        const encoded = btoa(unescape(encodeURIComponent(data)));
        navigator.clipboard.writeText(encoded).then(() => {
            showToast('備份碼已複製到剪貼簿');
        }).catch(() => {
            prompt('複製這段備份碼：', encoded);
        });
    } catch(e) {
        showToast('匯出失敗');
    }
}

function showImportModal() {
    document.getElementById('importModal').classList.add('show');
    document.getElementById('importInput').value = '';
    document.getElementById('importInput').focus();
}

function hideImportModal() {
    document.getElementById('importModal').classList.remove('show');
}

function importProgress() {
    const input = document.getElementById('importInput').value.trim();
    if (!input) { showToast('請貼上備份碼'); return; }
    try {
        const decoded = decodeURIComponent(escape(atob(input)));
        const imported = JSON.parse(decoded);
        if (imported.version && imported.steps) {
            state = imported;
            saveState();
            hideImportModal();
            render();
            showToast('進度已還原');
        } else {
            showToast('備份碼格式不正確');
        }
    } catch(e) {
        showToast('備份碼無法解析');
    }
}

// ══════════════════════════════════════════════
// Toast
// ══════════════════════════════════════════════
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

// ══════════════════════════════════════════════
// Firebase Sync (Layer 2)
// ══════════════════════════════════════════════
const FirebaseSync = {
    initialized: false,
    userId: null,
    _pushTimer: null,

    init(uid) {
        this.userId = uid;
        this.initialized = true;
    },

    // Debounced push: waits 1.5s after last change before writing
    schedulePush() {
        if (!this.initialized) return;
        clearTimeout(this._pushTimer);
        this._pushTimer = setTimeout(() => this.push(), 1500);
    },

    async push() {
        if (!this.initialized) return;
        try {
            await db.collection('users').doc(this.userId).set({
                progress: state,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        } catch(e) {
            console.warn('雲端同步寫入失敗（離線模式仍正常運作）', e);
        }
    },

    async pull() {
        if (!this.initialized) return null;
        try {
            const doc = await db.collection('users').doc(this.userId).get();
            if (doc.exists && doc.data().progress) {
                return doc.data().progress;
            }
        } catch(e) {
            console.warn('雲端同步讀取失敗（使用本地資料）', e);
        }
        return null;
    },

    async getPartner(partnerId) {
        if (!this.initialized) return null;
        try {
            const doc = await db.collection('users').doc(partnerId).get();
            if (doc.exists && doc.data().progress) {
                return doc.data().progress;
            }
        } catch(e) {
            console.warn('讀取夥伴進度失敗', e);
        }
        return null;
    }
};

// ══════════════════════════════════════════════
// Enhanced save with cloud sync
// ══════════════════════════════════════════════
const _originalSaveState = saveState;
saveState = function() {
    _originalSaveState();
    FirebaseSync.schedulePush();
};

// ══════════════════════════════════════════════
// Init: Anonymous auth → pull cloud → merge → render
// ══════════════════════════════════════════════
(async function initApp() {
    // First render with local data (instant)
    render();

    // Then try cloud sync in background
    try {
        const userCredential = await auth.signInAnonymously();
        const uid = userCredential.user.uid;
        FirebaseSync.init(uid);

        // Pull cloud data
        const cloudState = await FirebaseSync.pull();
        if (cloudState && cloudState.steps) {
            // Merge strategy: cloud wins if newer, local wins if cloud has no data for a step
            const localUpdated = Math.max(...Object.values(state.steps).map(s => s.updatedAt ? new Date(s.updatedAt).getTime() : 0));
            const cloudUpdated = Math.max(...Object.values(cloudState.steps).map(s => s.updatedAt ? new Date(s.updatedAt).getTime() : 0));

            if (cloudUpdated > localUpdated) {
                // Cloud is newer — use cloud state
                state = cloudState;
                _originalSaveState(); // save to localStorage
                render();
                showToast('已從雲端同步進度');
            } else if (localUpdated > 0 && cloudUpdated === 0) {
                // Local has data but cloud is empty — push local to cloud
                FirebaseSync.push();
            }
            // If same timestamp or both have data, keep local (last-write-wins on next save)
        } else if (Object.values(state.steps).some(s => s.status !== 'not_started')) {
            // No cloud data but local has progress — push to cloud
            FirebaseSync.push();
        }

        // Show sync indicator
        updateSyncStatus('connected');
    } catch(e) {
        console.warn('Firebase 初始化失敗（離線模式運作中）', e);
        updateSyncStatus('offline');
    }

    // LINE LIFF init (if available)
    LineLiff.init();
})();

function updateSyncStatus(status) {
    // Subtle indicator in toolbar
    const toolbar = document.querySelector('.toolbar');
    let indicator = document.getElementById('syncIndicator');
    if (!indicator) {
        indicator = document.createElement('div');
        indicator.id = 'syncIndicator';
        indicator.style.cssText = 'position:absolute;top:-8px;right:20px;font-size:10px;color:#888;';
        toolbar.style.position = 'fixed'; // already fixed but just in case
        toolbar.appendChild(indicator);
    }
    if (status === 'connected') {
        indicator.textContent = '☁️ 已連線同步';
        indicator.style.color = '#6B8E6B';
    } else {
        indicator.textContent = '📱 離線模式';
        indicator.style.color = '#AAA';
    }
}
