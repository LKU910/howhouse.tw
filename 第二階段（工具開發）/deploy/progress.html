    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; background: #EDEBE8; color: #121212;
            -webkit-font-smoothing: antialiased;
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
        }

        /* ── Layout ── */
        .progress-container { max-width: 680px; margin: 0 auto; padding: 0 20px 80px; }
        .progress-header {
            text-align: center; padding: 48px 20px 32px;
        }
        .progress-header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 28px; font-weight: 700; margin: 0 0 8px; color: #121212;
        }
        .progress-header .subtitle {
            font-size: 14px; color: #888; line-height: 1.6;
        }

        /* ── Persona Banner ── */
        .persona-banner {
            background: #fff; border-radius: 16px; padding: 20px 24px;
            margin-bottom: 32px; border: 1px solid #E5E2DE;
            display: none;
        }
        .persona-banner.visible { display: block; }
        .persona-banner .label { font-size: 12px; color: #B8956A; letter-spacing: 0.1em; margin-bottom: 6px; }
        .persona-banner .persona-title { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .persona-banner .persona-hint { font-size: 13px; color: #888; line-height: 1.6; }
        .persona-banner .retake-link { font-size: 12px; color: #B8956A; text-decoration: none; margin-top: 8px; display: inline-block; }
        .persona-banner .retake-link:hover { text-decoration: underline; }

        /* ── Overall Summary ── */
        .overall-summary {
            display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap;
        }
        .summary-chip {
            background: #fff; border: 1px solid #E5E2DE; border-radius: 12px;
            padding: 12px 16px; flex: 1; min-width: 140px; text-align: center;
        }
        .summary-chip .num { font-family: 'Noto Serif TC', serif; font-size: 28px; font-weight: 700; color: #B8956A; }
        .summary-chip .label { font-size: 12px; color: #888; margin-top: 2px; }

        /* ── Phase Section ── */
        .phase-section { margin-bottom: 24px; }
        .phase-header {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; background: #fff; border-radius: 14px;
            border: 1px solid #E5E2DE; cursor: pointer;
            transition: border-color 0.2s;
            user-select: none;
        }
        .phase-header:hover { border-color: #B8956A; }
        .phase-icon {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .phase-info { flex: 1; }
        .phase-name { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 700; }
        .phase-meta { font-size: 12px; color: #888; margin-top: 2px; }
        .phase-status {
            font-size: 11px; padding: 3px 10px; border-radius: 20px;
            white-space: nowrap; flex-shrink: 0;
        }
        .phase-status.not-started { background: #F5F3F0; color: #AAA; }
        .phase-status.in-progress { background: #FDF6EE; color: #B8956A; }
        .phase-status.done { background: #F0F5F0; color: #6B8E6B; }
        .phase-chevron {
            font-size: 14px; color: #BBB; transition: transform 0.3s; flex-shrink: 0;
        }
        .phase-section.open .phase-chevron { transform: rotate(180deg); }

        /* ── Phase connector ── */
        .phase-connector {
            display: flex; justify-content: center; padding: 4px 0;
        }
        .phase-connector svg { color: #D6D3D1; }

        /* ── Step Cards ── */
        .phase-steps {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .phase-section.open .phase-steps { max-height: 3000px; }

        .step-card {
            background: #fff; border: 1px solid #E5E2DE; border-radius: 14px;
            margin: 10px 0 0 0; padding: 16px 18px; position: relative;
            transition: border-color 0.2s;
        }
        .step-card:hover { border-color: #CCC; }

        .step-top { display: flex; align-items: flex-start; gap: 12px; }
        .step-num {
            font-family: 'Noto Serif TC', serif; font-size: 14px; font-weight: 700;
            color: #D6D3D1; flex-shrink: 0; width: 40px; text-align: center;
            line-height: 1; transition: color 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .step-icon { font-size: 22px; display: block; }
        .step-card[data-status="thinking"] .step-num { color: #B8956A; }
        .step-card[data-status="clear"] .step-num { color: #6B8E6B; }

        .step-content { flex: 1; min-width: 0; }
        .step-title {
            font-family: 'Noto Serif TC', serif; font-size: 15px; font-weight: 700;
            margin-bottom: 3px; color: #121212;
        }
        .step-desc { font-size: 12px; color: #999; line-height: 1.5; }

        /* ── Status Switcher ── */
        .status-switcher {
            display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap;
        }
        .status-btn {
            font-size: 12px; padding: 5px 12px; border-radius: 20px;
            border: 1px solid #E5E2DE; background: #FAFAFA; color: #888;
            cursor: pointer; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif;
        }
        .status-btn:hover { border-color: #CCC; }
        .status-btn.active-not_started { background: #F5F3F0; color: #999; border-color: #D6D3D1; }
        .status-btn.active-thinking { background: #FDF6EE; color: #B8956A; border-color: #B8956A; }
        .status-btn.active-clear { background: #F0F5F0; color: #6B8E6B; border-color: #6B8E6B; }

        /* ── Notes ── */
        .step-notes-area { margin-top: 10px; display: none; }
        .step-card[data-status="thinking"] .step-notes-area,
        .step-card[data-status="clear"] .step-notes-area { display: block; }

        .step-notes {
            width: 100%; border: 1px solid #E5E2DE; border-radius: 10px;
            padding: 10px 14px; font-size: 13px; font-family: 'Noto Sans TC', sans-serif;
            color: #333; background: #FAFAF8; resize: vertical; min-height: 60px;
            line-height: 1.7; transition: border-color 0.2s;
        }
        .step-notes:focus { outline: none; border-color: #B8956A; }
        .step-notes::placeholder { color: #CCC; }

        /* Locked note (想清楚了) */
        .step-note-locked {
            width: 100%; border: 1px solid #D4E4D4; border-radius: 10px;
            padding: 12px 14px; font-size: 13px; font-family: 'Noto Sans TC', sans-serif;
            color: #555; background: #F5FAF5; line-height: 1.7;
            white-space: pre-wrap; word-break: break-word;
        }
        .step-note-locked .note-content { color: #444; }
        .step-note-locked .note-empty { color: #AAA; font-style: italic; font-size: 12px; }
        .step-note-edit-hint {
            font-size: 11px; color: #BBB; margin-top: 4px;
        }

        /* ── Persona Tip ── */
        .persona-tip {
            font-size: 12px; color: #B8956A; background: #FDF6EE;
            border-radius: 8px; padding: 8px 12px; margin-top: 8px;
            line-height: 1.6; display: none;
        }
        .persona-tip.visible { display: block; }
        .step-card[data-status="clear"] .persona-tip { display: none; }

        /* ── Step Link ── */
        .step-link {
            display: inline-block; font-size: 12px; color: #B8956A;
            text-decoration: none; margin-top: 8px;
        }
        .step-link:hover { text-decoration: underline; }

        /* ── Dependency hint ── */
        .dep-hint {
            font-size: 11px; color: #BBB; margin-top: 6px; display: none;
        }
        .dep-hint.visible { display: block; }

        /* ── Toolbar ── */
        .toolbar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(237, 235, 232, 0.95); backdrop-filter: blur(8px);
            border-top: 1px solid #E5E2DE; padding: 12px 20px;
            display: flex; justify-content: center; gap: 12px; z-index: 50;
        }
        .toolbar-btn {
            font-size: 13px; padding: 8px 18px; border-radius: 10px;
            border: 1px solid #D6D3D1; background: #fff; color: #555;
            cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.2s;
        }
        .toolbar-btn:hover { border-color: #B8956A; color: #B8956A; }
        .toolbar-btn.primary {
            background: #B8956A; color: #fff; border-color: #B8956A;
        }
        .toolbar-btn.primary:hover { background: #8B6844; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 24px; border-radius: 10px;
            font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            z-index: 60;
        }
        .toast.show { opacity: 1; }

        /* ── Empty State ── */
        .empty-cta {
            text-align: center; padding: 40px 20px; background: #fff;
            border-radius: 16px; border: 1px solid #E5E2DE; margin-bottom: 32px;
        }
        .empty-cta h3 { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700; margin: 0 0 8px; }
        .empty-cta p { font-size: 14px; color: #888; margin: 0 0 16px; }
        .empty-cta a {
            display: inline-block; padding: 10px 24px; background: #B8956A; color: #fff;
            border-radius: 10px; text-decoration: none; font-size: 14px;
            transition: background 0.2s;
        }
        .empty-cta a:hover { background: #8B6844; }

        /* ── Partner Hint ── */
        .partner-hint {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 18px; margin-bottom: 24px;
            background: #fff; border: 1px solid #E5E2DE; border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .partner-hint:hover { border-color: #B8956A; background: #FDF6EE; }
        .partner-hint-icon { font-size: 20px; flex-shrink: 0; }
        .partner-hint-text { font-size: 13px; color: #666; line-height: 1.5; flex: 1; }
        .partner-hint-text strong { color: #B8956A; }
        .partner-hint-arrow { color: #B8956A; font-size: 16px; flex-shrink: 0; }
        .partner-hint.linked {
            border-color: #D4E8D4; background: #F5FAF5;
        }
        .partner-hint.linked .partner-hint-text { color: #6B8E6B; }
        .partner-hint.linked .partner-hint-text strong { color: #6B8E6B; }

        /* ── Modal (shared by partner modal) ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff; border-radius: 16px; padding: 28px; max-width: 420px;
            width: calc(100% - 40px); box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-box h3 { font-family: 'Noto Serif TC', serif; font-size: 18px; margin: 0 0 12px; }
        .modal-box p { font-size: 13px; color: #888; margin: 0 0 16px; line-height: 1.6; }
        .modal-box textarea {
            width: 100%; height: 120px; border: 1px solid #E5E2DE; border-radius: 10px;
            padding: 10px; font-size: 12px; font-family: monospace; resize: vertical;
        }
        .modal-box textarea:focus { outline: none; border-color: #B8956A; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
        .modal-actions button {
            padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif; border: 1px solid #E5E2DE;
        }
        .modal-actions .cancel { background: #fff; color: #888; }
        .modal-actions .confirm { background: #B8956A; color: #fff; border-color: #B8956A; }

        /* ── Nav (uses Tailwind classes, minimal overrides) ── */

        /* ── LINE Login Banner ── */
        .line-login-banner {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px; margin-bottom: 20px;
            background: #fff; border: 1px solid #E5E2DE; border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .line-login-banner:hover { border-color: #06C755; background: #F5FBF5; }
        .line-login-banner .line-icon { font-size: 20px; flex-shrink: 0; }
        .line-login-banner .line-text { font-size: 13px; color: #666; line-height: 1.5; flex: 1; }
        .line-login-banner .line-text strong { color: #06C755; }
        .line-login-banner .line-action {
            padding: 6px 14px; border-radius: 8px; font-size: 12px;
            background: #06C755; color: #fff; border: none; cursor: pointer;
            white-space: nowrap; flex-shrink: 0;
        }
        .line-login-banner.logged-in {
            cursor: default; background: #F5FBF5; border-color: #D4E8D4;
        }
        .line-login-banner.logged-in .line-text { color: #06C755; }

        /* ── Sync Status ── */
        .sync-indicator {
            font-size: 12px; color: #999; text-align: center;
            padding: 6px 0; margin-bottom: 12px;
        }
        .sync-indicator .dot {
            display: inline-block; width: 6px; height: 6px;
            border-radius: 50%; margin-right: 4px; vertical-align: middle;
        }
        .sync-indicator .dot.online { background: #6B8E6B; }
        .sync-indicator .dot.offline { background: #DDD; }

        /* ── Encouragement Block ── */
        .encouragement {
            background: #fff; border: 1px solid #E5E2DE; border-radius: 16px;
            padding: 24px 28px; margin-top: 32px; text-align: center;
            transition: opacity 0.4s;
        }
        .encouragement .enc-icon {
            font-size: 28px; margin-bottom: 8px; display: block;
        }
        .encouragement .enc-msg {
            font-family: 'Noto Serif TC', serif; font-size: 15px;
            font-weight: 500; color: #444; line-height: 1.8;
        }
        .encouragement .enc-sub {
            font-size: 13px; color: #999; margin-top: 8px; line-height: 1.6;
        }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            .progress-header { padding: 32px 16px 24px; }
            .progress-header h1 { font-size: 24px; }
            .progress-container { padding: 0 16px 90px; }
            .summary-chip .num { font-size: 24px; }

            /* Larger step cards on mobile */
            .step-card { padding: 20px; }
            .step-title { font-size: 17px; margin-bottom: 6px; }
            .step-desc { font-size: 14px; line-height: 1.6; }
            .step-num { font-size: 13px; width: 36px; }
            .step-icon { font-size: 24px; }

            /* Larger status buttons for touch */
            .status-switcher { gap: 8px; margin-top: 14px; }
            .status-btn {
                font-size: 14px; padding: 10px 16px;
                min-height: 44px; display: flex; align-items: center; justify-content: center;
                flex: 1; text-align: center;
            }

            /* Phase headers */
            .phase-header { padding: 16px; }
            .phase-icon { width: 42px; height: 42px; font-size: 20px; }
            .phase-name { font-size: 17px; }
            .phase-meta { font-size: 13px; }
            .phase-status { font-size: 12px; padding: 4px 12px; }

            /* Notes */
            .step-notes { font-size: 15px; padding: 14px 16px; min-height: 80px; }
            .step-note-locked { font-size: 14px; padding: 14px 16px; }

            /* Partner hint */
            .partner-hint { padding: 16px; }
            .partner-hint-text { font-size: 14px; }
            .partner-hint-icon { font-size: 24px; }

            /* LINE banner */
            .line-login-banner { padding: 16px; }
            .line-login-banner .line-text { font-size: 14px; }

            /* Toolbar */
            .toolbar { padding: 14px 20px; gap: 10px; }
            .toolbar-btn { font-size: 14px; padding: 12px 20px; min-height: 44px; flex: 1; }
        }
    </style>
</head>

<script>
// ══════════════════════════════════════════════
// Data Definitions
// ══════════════════════════════════════════════
const PHASES = [
    {
        id: 'prep', name: '自我準備', icon: '🪞', steps: ['01','02'],
        color: '#A8A098'

    {
        id: 'research', name: '研究功課', icon: '🔍', steps: ['03','04','05','06'],

    },
    {
        id: 'visit', name: '實地勘查', icon: '👁', steps: ['07','08'],
        color: '#B8956A'
    },
    {
        id: 'deal', name: '議價成交', icon: '🤝', steps: ['09','10','11'],
        color: '#96704A'
    },
    {
        id: 'wait', name: '等待期', icon: '⏳', steps: ['12','13'],

    },

const STEPS = {
    '01': { name: '需求釐清', icon: '📋', desc: '幾房？通勤多遠？學區？先把條件寫下來', placeholder: '例：3房、通勤30分鐘內、有學區...' },

    '03': { name: '認識房型', icon: '🏢', desc: '大樓、透天、華廈、公寓差在哪？公設比怎麼看？', placeholder: '例：傾向大樓、公設比希望<33%...' },
    '04': { name: '實價登錄', icon: '📊', desc: '價格合不合理？同區域別人成交多少？', placeholder: '例：目標區域近一年均價...' },
    '05': { name: '建商調查', icon: '🔎', desc: '蓋過什麼？被告過嗎？網路風評如何？', placeholder: '例：看好的建商名稱、評價紀錄...' },
    '06': { name: '區域評估', icon: '📍', desc: '生活機能、交通、學區，把比較表列出來', placeholder: '例：考慮A區 vs B區，通勤差異...' },
    '07': { name: '預約看房', icon: '📅', desc: '白天晚上各去一次，代銷話術不要全信', placeholder: '例：已約看哪些案場、日期...' },
    '08': { name: '現場評估', icon: '👁️', desc: '平面圖、樑柱位置、管線配置，仔細確認', placeholder: '例：這間的優缺點紀錄...' },
    '09': { name: '比較決策', icon: '⚖️', desc: '開價不等於成交價，查實價登錄再談', placeholder: '例：目前前三名物件比較...' },
    '10': { name: '簽約須知', icon: '✍️', desc: '合約帶回家看五天，違約罰則要問清楚', placeholder: '例：合約裡需要注意的條款...' },
    '11': { name: '客變規劃', icon: '📐', desc: '預售屋可以改格局，但要在期限內提出', placeholder: '例：想改的格局、客變期限...' },
    '12': { name: '工程追蹤', icon: '🏗️', desc: '定期去工地看進度，留意建材變更通知', placeholder: '例：上次去工地的觀察...' },
    '13': { name: '貸款對保', icon: '🏦', desc: '多比幾家銀行利率，問清寬限期與優惠', placeholder: '例：比較的銀行利率...' },
    '14': { name: '驗屋準備', icon: '🔍', desc: '自己帶清單或請專業驗屋公司，交屋前必做', placeholder: '例：驗屋公司選擇、清單...' },
    '15': { name: '交屋流程', icon: '🔑', desc: '水電瓦斯過戶、管委會交接、拿鑰匙', placeholder: '例：過戶進度、待辦事項...' },
    '16': { name: '產權登記', icon: '📜', desc: '確認產權清楚、地政過戶、抵押權設定', placeholder: '例：地政進度紀錄...' },
    '17': { name: '裝修與入住', icon: '🛋️', desc: '裝修、動線規劃、收納設計，提前準備', placeholder: '例：裝修預算、風格想法...' },
    '18': { name: '保固追蹤', icon: '🛡️', desc: '記錄缺陷、追蹤保固期限、定期維護', placeholder: '例：需要追蹤的保固項目...' }
};

// Step dependencies: { step: [depends_on_steps] }
const DEPENDENCIES = {
    '04': ['02'], // 實價登錄 ← 財務健檢（知道預算才知道查什麼範圍）
    '09': ['07','08'], // 比較決策 ← 看房 + 現場評估
    '10': ['05'], // 簽約須知 ← 建商調查
    '13': ['02'], // 貸款對保 ← 財務健檢
    '14': ['10'] // 驗屋準備 ← 簽約須知
};

const DEP_HINTS = {
    '04': '這一步會用到你在第 2 步算的預算範圍',
    '09': '回顧你在第 7、8 步的看房紀錄會更清楚',
    '10': '你在第 5 步查的建商紀錄，簽約時很重要',
    '13': '你在第 2 步算的月付上限是這裡的底線',
    '14': '對照你在第 10 步記的合約條款來驗'
};

// Persona data (matches quiz.html)
const PERSONAS = {
    steady_player: {
        title: '穩健棋手',
        hint: '你習慣用數據做判斷。留意不要因為太理性而忽略住的「感覺」。',
        tips: { '08': '帶著清單去看，但也留 10 分鐘不看清單，純粹感受', '09': '你的框架是優勢——設好停損點就行動' }
    },
    intuitive_hunter: {
        title: '直覺獵手',
        hint: '你的直覺很準，但記得用數字幫感覺做確認。',
        tips: { '07': '去看吧，但帶著清單去，別空手', '09': '看完隔一天再看筆記——隔天還想要的才是真的' }
    },
    perfectionist: {
        title: '完美主義者',
        hint: '你的研究很扎實。挑戰是知道什麼時候該停止比較、開始行動。',
        tips: { '09': '「再多看一間」的念頭永遠不會停——還記得你設的停損點嗎？', '02': '用數字畫一條線，到了就停' }
    },
    anxious_actor: {
        title: '焦慮行動者',
        hint: '「怕錯過」的感覺很真實，但先把底線寫下來再出門。',
        tips: { '02': '有數字你就不會被情緒帶著走', '10': '任何現場想做的決定，回家睡一晚再說' }
    },
    cautious_observer: {
        title: '謹慎觀望者',
        hint: '每次只處理一步就好。走過三步之後，你會發現自己比想像的更有判斷力。',
        tips: { '01': '從最不需要做決定的地方開始', '03': '了解差異，你會發現沒那麼複雜' }
    },
    rational_novice: {
        title: '理性新手',
        hint: '你會研究，但記得也問問已經買過房的人那些「數據查不到」的事。',
        tips: { '05': '你擅長研究——建商調查最值得花時間', '06': '比較生活機能和通勤，你擅長這個' }
    },
    emotional_explorer: {
        title: '感性探索者',
        hint: '你對家的想像是買房最重要的動力。下一步是把想像轉成具體條件。',
        tips: { '01': '把「想要有陽光的客廳」轉成「朝南、5 樓以上、前方無遮蔽」', '07': '看房會讓想像變具體' }
    },
    composed: {
        title: '從容決策者',
        hint: '你準備得差不多了。需要的不是更多資訊，而是一個比較框架。',
        tips: { '09': '建立你的物件比較框架', '10': '先把「不可妥協」和「可接受次優」寫下來' }
    }
};

// ══════════════════════════════════════════════
// State
// ══════════════════════════════════════════════
const STORAGE_KEY = 'zeju-progress';
let state = loadState();
let personaId = null;

function defaultState() {
    const steps = {};
    Object.keys(STEPS).forEach(id => {
        steps[id] = { status: 'not_started', notes: '', updatedAt: null };
    });
    return { version: 1, startedAt: new Date().toISOString().slice(0,10), steps };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
    } catch(e) {}
    return defaultState();
}

function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadPersona() {
    try {
        const quiz = JSON.parse(localStorage.getItem('quizResultV2') || '{}');
        if (quiz.persona && PERSONAS[quiz.persona]) {
            personaId = quiz.persona;
        }
    } catch(e) {}
}

// ══════════════════════════════════════════════
// Render
// ══════════════════════════════════════════════
function render() {
    loadPersona();
    renderPersonaBanner();
    renderSummary();
    renderPath();
    renderEncouragement();
}

function renderPersonaBanner() {
    const banner = document.getElementById('personaBanner');
    const cta = document.getElementById('quizCta');
    if (personaId) {
        const p = PERSONAS[personaId];
        document.getElementById('bannerPersonaTitle').textContent = p.title;
        document.getElementById('bannerPersonaHint').textContent = p.hint;
        banner.classList.add('visible');
        cta.style.display = 'none';
    } else {
        banner.classList.remove('visible');
        cta.style.display = 'block';
    }
}

function renderSummary() {
    let clear = 0, thinking = 0, notStarted = 0;
    Object.values(state.steps).forEach(s => {
        if (s.status === 'clear') clear++;
        else if (s.status === 'thinking') thinking++;
        else notStarted++;
    });
    document.getElementById('countClear').textContent = clear;
    document.getElementById('countThinking').textContent = thinking;
    document.getElementById('countRemaining').textContent = notStarted;
}

function renderEncouragement() {
    const el = document.getElementById('encouragement');
    if (!el) return;

    let clear = 0, thinking = 0;
    Object.values(state.steps).forEach(s => {
        if (s.status === 'clear') clear++;
        else if (s.status === 'thinking') thinking++;
    });

    let icon, msg, sub;

    if (clear === 18) {
        icon = '🎉';
        msg = '18 步都走完了。你已經準備好了。';
        sub = '這段路不容易，但你一步一步走過來了。';
    } else if (clear >= 14) {
        icon = '🏁';
        msg = '收尾階段了，剩下的路你很清楚。';
        sub = `還有 ${18 - clear} 步。最後幾步不急，但別忘了它們。`;
    } else if (clear >= 9) {
        icon = '💪';
        msg = '超過一半了。回頭看看，你已經走了很遠。';
        sub = `${clear}/18 步想清楚了。剩下的，你知道怎麼走。`;
    } else if (clear >= 4) {
        icon = '🚶';
        msg = '穩穩地走著。每一步想清楚，後面的路就更明確。';
        sub = `${clear}/18 步已經定案，${thinking > 0 ? `還有 ${thinking} 步正在想。` : '繼續往前走。'}`;
    } else if (clear >= 1) {
        icon = '🌱';
        msg = `走了 ${clear} 步了。不急，按自己的節奏來。`;
        sub = thinking > 0 ? `有 ${thinking} 步正在想，想到哪算哪。` : '每一步都是在幫未來的自己做準備。';
    } else if (thinking >= 3) {
        icon = '🤔';
        msg = '你有好幾步在想了。不用急著全部想清楚。';
        sub = '先把最有把握的那一步定下來，會更踏實。';
    } else if (thinking >= 1) {
        icon = '👣';
        msg = '你已經開始想了，這就是最重要的一步。';
        sub = '想清楚一步，就標記「想清楚了」，給自己一個紀錄。';
    } else {
        icon = '🧭';
        msg = '18 步看起來很多，但你不需要一次走完。';
        sub = '找一步最有感覺的，點開來看看就好。';
    }

    el.innerHTML = `
        <span class="enc-icon">${icon}</span>
        <div class="enc-msg">${msg}</div>
        <div class="enc-sub">${sub}</div>
    `;
}

function getPhaseStatus(phase) {
    const statuses = phase.steps.map(id => state.steps[id].status);
    if (statuses.every(s => s === 'clear')) return 'done';
    if (statuses.every(s => s === 'not_started')) return 'not-started';
    return 'in-progress';
}

function getPhaseLabel(status) {
    if (status === 'done') return '想清楚了';
    if (status === 'in-progress') return '正在這個階段';
    return '還沒走到';
}

function renderPath() {
    const map = document.getElementById('pathMap');
    map.innerHTML = '';

    PHASES.forEach((phase, pi) => {
        const phaseStatus = getPhaseStatus(phase);

        // Phase section
        const section = document.createElement('div');
        section.className = 'phase-section';
        section.id = 'phase-' + phase.id;

        // Auto-open if in progress
        if (phaseStatus === 'in-progress') section.classList.add('open');

        // Phase header
        section.innerHTML = `
            <div class="phase-header" onclick="togglePhase('${phase.id}')">
                <div class="phase-icon" style="background: ${phase.color}15; color: ${phase.color};">${phase.icon}</div>
                <div class="phase-info">
                    <div class="phase-name">${phase.name}</div>
                    <div class="phase-meta">STEP ${phase.steps[0]}–${phase.steps[phase.steps.length-1]}</div>
                </div>
                <span class="phase-status ${phaseStatus}">${getPhaseLabel(phaseStatus)}</span>
                <span class="phase-chevron">▾</span>
            </div>
            <div class="phase-steps" id="steps-${phase.id}"></div>
        `;

        map.appendChild(section);

        // Step cards
        const stepsContainer = section.querySelector('.phase-steps');
        phase.steps.forEach(stepId => {
            const step = STEPS[stepId];
            const stepState = state.steps[stepId];
            const card = document.createElement('div');
            card.className = 'step-card';
            card.id = 'step-' + stepId;
            card.dataset.status = stepState.status;

            // Persona tip
            let tipHtml = '';
            if (personaId && PERSONAS[personaId].tips[stepId]) {
                tipHtml = `<div class="persona-tip visible">${PERSONAS[personaId].tips[stepId]}</div>`;
            }

            // Dependency hint
            let depHtml = '';
            if (DEP_HINTS[stepId]) {
                const depSteps = DEPENDENCIES[stepId] || [];
                const anyDepDone = depSteps.some(d => state.steps[d].status === 'clear');
                const showDep = stepState.status !== 'clear' && !anyDepDone;
                depHtml = `<div class="dep-hint ${showDep ? 'visible' : ''}">${DEP_HINTS[stepId]}</div>`;
            }

            card.innerHTML = `
                <div class="step-top">
                    <div class="step-num"><span class="step-icon">${step.icon}</span>${stepId}</div>
                    <div class="step-content">
                        <div class="step-title">${step.name}</div>
                        <div class="step-desc">${step.desc}</div>
                    </div>
                </div>
                <div class="status-switcher">
                    <button class="status-btn ${stepState.status === 'not_started' ? 'active-not_started' : ''}"
                            onclick="setStatus('${stepId}','not_started')">尚未面對</button>
                    <button class="status-btn ${stepState.status === 'thinking' ? 'active-thinking' : ''}"
                            onclick="setStatus('${stepId}','thinking')">正在想</button>
                    <button class="status-btn ${stepState.status === 'clear' ? 'active-clear' : ''}"
                            onclick="setStatus('${stepId}','clear')">想清楚了</button>
                </div>
                <div class="step-notes-area">
                    ${stepState.status === 'clear'
                        ? `<div class="step-note-locked">
                              ${stepState.notes
                                  ? `<div class="note-content">${stepState.notes.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`
                                  : `<div class="note-empty">沒有留下筆記</div>`}
                           </div>
                           <div class="step-note-edit-hint">切回「正在想」即可修改筆記</div>`
                        : `<textarea class="step-notes"
                              placeholder="${step.placeholder}"
                              oninput="saveNotes('${stepId}', this.value)">${stepState.notes}</textarea>`}
                    ${tipHtml}
                    ${depHtml}
                </div>
                <a href="step/${stepId}.html" class="step-link">閱讀這一步的完整內容 →</a>
            `;

            stepsContainer.appendChild(card);
        });

        // Phase connector (except last)
        if (pi < PHASES.length - 1) {
            const connector = document.createElement('div');
            connector.className = 'phase-connector';
            connector.innerHTML = '<svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0 L8 8 M4 12 L8 18 L12 12" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>';
            map.appendChild(connector);
        }
    });
}

// ══════════════════════════════════════════════
// Actions
// ══════════════════════════════════════════════
function setStatus(stepId, status) {
    state.steps[stepId].status = status;
    state.steps[stepId].updatedAt = new Date().toISOString();
    saveState();

    // Update card
    const card = document.getElementById('step-' + stepId);
    card.dataset.status = status;

    // Update status buttons
    card.querySelectorAll('.status-btn').forEach(btn => {
        btn.className = 'status-btn';
    });
    const buttons = card.querySelectorAll('.status-btn');
    const idx = ['not_started','thinking','clear'].indexOf(status);
    if (idx >= 0) buttons[idx].classList.add('active-' + status);

    // Re-render notes area (lock/unlock based on status)
    const notesArea = card.querySelector('.step-notes-area');
    if (notesArea) {
        const stepState = state.steps[stepId];
        const step = STEPS[stepId];
        // Preserve tip and dep HTML
        const tipEl = notesArea.querySelector('.persona-tip');
        const depEl = notesArea.querySelector('.dep-hint');
        const tipHtml = tipEl ? tipEl.outerHTML : '';
        const depHtml = depEl ? depEl.outerHTML : '';

        if (status === 'clear') {
            const escaped = stepState.notes ? stepState.notes.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
            notesArea.innerHTML = `
                <div class="step-note-locked">
                    ${escaped ? `<div class="note-content">${escaped}</div>` : `<div class="note-empty">沒有留下筆記</div>`}
                </div>
                <div class="step-note-edit-hint">切回「正在想」即可修改筆記</div>
                ${tipHtml}${depHtml}`;
        } else if (status === 'thinking') {
            notesArea.innerHTML = `
                <textarea class="step-notes"
                          placeholder="${step.placeholder}"
                          oninput="saveNotes('${stepId}', this.value)">${stepState.notes}</textarea>
                ${tipHtml}${depHtml}`;
        }
    }

    // Update phase status
    const phase = PHASES.find(p => p.steps.includes(stepId));
    if (phase) {
        const phaseStatus = getPhaseStatus(phase);
        const section = document.getElementById('phase-' + phase.id);
        const statusEl = section.querySelector('.phase-status');
        statusEl.className = 'phase-status ' + phaseStatus;
        statusEl.textContent = getPhaseLabel(phaseStatus);
    }

    renderSummary();
    renderEncouragement();
}

function saveNotes(stepId, value) {
    state.steps[stepId].notes = value;
    state.steps[stepId].updatedAt = new Date().toISOString();
    saveState();
}

function togglePhase(phaseId) {
    const section = document.getElementById('phase-' + phaseId);
    section.classList.toggle('open');
}

function expandAll() {
    const allOpen = document.querySelectorAll('.phase-section:not(.open)').length === 0;
    document.querySelectorAll('.phase-section').forEach(s => {
        if (allOpen) s.classList.remove('open');
        else s.classList.add('open');
    });
    // Update button text
    const btn = document.querySelector('.toolbar-btn.primary');
    btn.textContent = allOpen ? '展開全部' : '收合全部';
}

// ══════════════════════════════════════════════
// Export / Import
// ══════════════════════════════════════════════
function exportProgress() {
    try {
        const data = JSON.stringify(state);
        const encoded = btoa(unescape(encodeURIComponent(data)));
        navigator.clipboard.writeText(encoded).then(() => {
            showToast('備份碼已複製到剪貼簿');
        }).catch(() => {
            prompt('複製這段備份碼：', encoded);
        });
    } catch(e) {
        showToast('匯出失敗');
    }
}

// Import functions retained for potential future use
function importFromCode(code) {
    if (!code) return;
    try {
        const decoded = decodeURIComponent(escape(atob(code)));
        const imported = JSON.parse(decoded);
        if (imported.version && imported.steps) {
            state = imported;
            saveState();
            render();
            showToast('進度已還原');
        }
    } catch(e) {
        console.warn('備份碼無法解析', e);
    }
}

// ══════════════════════════════════════════════
// Toast
// ══════════════════════════════════════════════
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

// ══════════════════════════════════════════════
// Firebase Sync (Layer 2)
// ══════════════════════════════════════════════
const FirebaseSync = {
    initialized: false,
    userId: null,
    _pushTimer: null,

    init(uid) {
        this.userId = uid;
        this.initialized = true;
    },

    // Debounced push: waits 1.5s after last change before writing
    schedulePush() {
        if (!this.initialized) return;
        clearTimeout(this._pushTimer);
        this._pushTimer = setTimeout(() => this.push(), 1500);
    },

    async push() {
        if (!this.initialized) return;
        try {
            await db.collection('users').doc(this.userId).set({
                progress: state,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        } catch(e) {
            console.warn('雲端同步寫入失敗（離線模式仍正常運作）', e);
        }
    },

    async pull() {
        if (!this.initialized) return null;
        try {
            const doc = await db.collection('users').doc(this.userId).get();
            if (doc.exists && doc.data().progress) {
                return doc.data().progress;
            }
        } catch(e) {
            console.warn('雲端同步讀取失敗（使用本地資料）', e);
        }
        return null;
    },

    async getPartner(partnerId) {
        if (!this.initialized) return null;
        try {
            const doc = await db.collection('users').doc(partnerId).get();
            if (doc.exists && doc.data().progress) {
                return doc.data().progress;
            }
        } catch(e) {
            console.warn('讀取夥伴進度失敗', e);
        }
        return null;
    }
};

// ══════════════════════════════════════════════
// LINE LIFF Integration (Layer 2)
// ══════════════════════════════════════════════
const LineLiff = {
    ready: false,
    liffId: '2009797886-geRkxqSN',
    profile: null,

    async init() {
        if (!this.liffId || typeof liff === 'undefined') return;
        try {
            await liff.init({ liffId: this.liffId });
            this.ready = true;
            console.log('LIFF initialized, isInClient:', liff.isInClient(), 'isLoggedIn:', liff.isLoggedIn());

            if (liff.isLoggedIn()) {
                await this.loadProfile();
            }
            this.renderLoginUI();
        } catch(e) {
            console.warn('LIFF 初始化失敗（不影響基本功能）', e);
        }
    },

    async loadProfile() {
        try {
            this.profile = await liff.getProfile();
            console.log('LINE profile:', this.profile.displayName);

            // Upgrade anonymous Firebase user with LINE identity
            if (FirebaseSync.initialized && FirebaseSync.userId) {
                await db.collection('users').doc(FirebaseSync.userId).set({
                    lineProfile: {
                        userId: this.profile.userId,
                        displayName: this.profile.displayName,
                        pictureUrl: this.profile.pictureUrl || null
                    },
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            }
            this.renderLoginUI();
        } catch(e) {
            console.warn('取得 LINE 個人資料失敗', e);
        }
    },

    login() {
        // Redirect to LIFF URL — lets LINE handle the entire OAuth flow
        // More reliable than liff.login() which can hit 400 errors
        window.location.href = 'https://liff.line.me/' + this.liffId;
    },

    renderLoginUI() {
        const banner = document.getElementById('lineLoginBanner');
        if (!banner) return;

        if (this.profile) {
            // Logged in — show confirmation banner
            const pic = this.profile.pictureUrl
                ? `<img src="${this.profile.pictureUrl}" style="width:24px;height:24px;border-radius:50%;flex-shrink:0;">`
                : '<span class="line-icon">✅</span>';
            banner.classList.add('logged-in');
            banner.onclick = null;
            banner.style.display = 'flex';
            banner.innerHTML = `
                ${pic}
                <span class="line-text"><strong>${this.profile.displayName}</strong> 已連結，進度會自動同步到雲端。</span>
            `;
        } else if (this.ready && !liff.isLoggedIn()) {
            // Not logged in — show login prompt
            banner.style.display = 'flex';
        } else {
            banner.style.display = 'none';
        }
    },

    async shareProgress() {
        console.log('shareProgress called — ready:', this.ready, 'isLoggedIn:', this.ready && liff.isLoggedIn(), 'profile:', !!this.profile);

        // If LIFF not ready or not logged in, fall back to clipboard share
        if (!this.ready || !liff.isLoggedIn()) {
            this.fallbackShare();
            return;
        }
        if (!liff.isApiAvailable('shareTargetPicker')) {
            this.fallbackShare();
            return;
        }

        // Build share message
        const completed = Object.values(state.steps).filter(s => s.status === 'clear').length;
        const inProgress = Object.values(state.steps).filter(s => s.status === 'thinking').length;
        const total = 18;

        try {
            await liff.shareTargetPicker([{
                type: 'flex',
                altText: `我的買房進度：已想清楚 ${completed}/${total} 步`,
                contents: {
                    type: 'bubble',
                    hero: {
                        type: 'box',
                        layout: 'vertical',
                        contents: [{
                            type: 'text',
                            text: '🏠 擇居 — 買房進度',
                            weight: 'bold',
                            size: 'lg',
                            align: 'center',
                            color: '#2D5A3D'
                        }],
                        paddingAll: '20px',
                        backgroundColor: '#F5F0E8'
                    },
                    body: {
                        type: 'box',
                        layout: 'vertical',
                        contents: [
                            {
                                type: 'text',
                                text: `✅ 想清楚了：${completed} 步`,
                                size: 'md',
                                color: '#2D5A3D'
                            },
                            {
                                type: 'text',
                                text: `🔄 正在想：${inProgress} 步`,
                                size: 'md',
                                color: '#B8860B',
                                margin: 'sm'
                            },
                            {
                                type: 'text',
                                text: `📊 還沒走到：${total - completed - inProgress} 步`,
                                size: 'md',
                                color: '#888',
                                margin: 'sm'
                            }
                        ],
                        paddingAll: '16px'
                    },
                    footer: {
                        type: 'box',
                        layout: 'vertical',
                        contents: [{
                            type: 'button',
                            action: {
                                type: 'uri',
                                label: '一起來看看',
                                uri: `https://liff.line.me/${this.liffId}`
                            },
                            style: 'primary',
                            color: '#2D5A3D'
                        }],
                        paddingAll: '12px'
                    }
                }
            }]);
            showToast('已分享進度！');
        } catch(e) {
            console.warn('分享失敗', e);
            this.fallbackShare();
        }
    },

    fallbackShare() {
        const completed = Object.values(state.steps).filter(s => s.status === 'clear').length;
        const text = `我正在用擇居追蹤買房進度，已經想清楚 ${completed}/18 步了。一起來看看？\nhttps://howhouse.tw/progress.html`;
        if (navigator.share) {
            navigator.share({ title: '擇居 — 我的買房地圖', text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text).then(() => showToast('已複製分享文字'));
        }
    }
};

// ══════════════════════════════════════════════
// Enhanced save with cloud sync
// ══════════════════════════════════════════════
const _originalSaveState = saveState;
saveState = function() {
    _originalSaveState();
    FirebaseSync.schedulePush();
};

// ══════════════════════════════════════════════
// Init: Anonymous auth → pull cloud → merge → render
// ══════════════════════════════════════════════
(async function initApp() {
    // First render with local data (instant)
    render();

    // Then try cloud sync in background
    try {
        const userCredential = await auth.signInAnonymously();
        const uid = userCredential.user.uid;
        FirebaseSync.init(uid);

        // Pull cloud data
        const cloudState = await FirebaseSync.pull();
        if (cloudState && cloudState.steps) {
            // Merge strategy: cloud wins if newer, local wins if cloud has no data for a step
            const localUpdated = Math.max(...Object.values(state.steps).map(s => s.updatedAt ? new Date(s.updatedAt).getTime() : 0));
            const cloudUpdated = Math.max(...Object.values(cloudState.steps).map(s => s.updatedAt ? new Date(s.updatedAt).getTime() : 0));

            if (cloudUpdated > localUpdated) {
                // Cloud is newer — use cloud state
                state = cloudState;
                _originalSaveState(); // save to localStorage
                render();
                showToast('已從雲端同步進度');
            } else if (localUpdated > 0 && cloudUpdated === 0) {
                // Local has data but cloud is empty — push local to cloud
                FirebaseSync.push();
            }
            // If same timestamp or both have data, keep local (last-write-wins on next save)
        } else if (Object.values(state.steps).some(s => s.status !== 'not_started')) {
            // No cloud data but local has progress — push to cloud
            FirebaseSync.push();
        }

        // Show sync indicator
        updateSyncStatus('connected');
    } catch(e) {
        console.warn('Firebase 初始化失敗（離線模式運作中）', e);
        updateSyncStatus('offline');
    }

    // LINE LIFF init (if available)
    LineLiff.init();
})();

function updateSyncStatus(status) {
    const indicator = document.getElementById('syncIndicatorInline');
    if (!indicator) return;
    const dot = indicator.querySelector('.dot');
    const text = indicator.querySelector('.sync-text');
    indicator.style.display = 'block';
    if (status === 'connected') {
        dot.className = 'dot online';
        text.textContent = '已連線同步';
    } else {
        dot.className = 'dot offline';
        text.textContent = '離線模式 — 進度儲存在這台裝置';
    }
}

// ══════════════════════════════════════════════
// Partner Mode (雙人模式)
// ══════════════════════════════════════════════
function generatePairCode(uid) {
    // Short 6-char code derived from uid
    const hash = uid.split('').reduce((a, c) => ((a << 5) - a + c.charCodeAt(0)) | 0, 0);
    return Math.abs(hash).toString(36).toUpperCase().substring(0, 6).padEnd(6, 'A');
}

function showPartnerModal() {
    const modal = document.getElementById('partnerModal');
    modal.classList.add('show');

    if (FirebaseSync.userId) {
        const code = generatePairCode(FirebaseSync.userId);
        document.getElementById('myPairCode').value = code;

        // Store pair code → uid mapping in Firestore
        db.collection('pairCodes').doc(code).set({
            uid: FirebaseSync.userId,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(e => console.warn('配對碼儲存失敗', e));

        // Check if already paired — show paired state
        const savedPartner = localStorage.getItem('zeju_partner_code');
        if (savedPartner) {
            showPartnerModalPairedState(savedPartner);
            document.getElementById('partnerStatus').innerHTML = '✅ 已配對，重新整理頁面可看到對方進度';
        }
    } else {
        document.getElementById('myPairCode').value = '未連線';
    }
}

function hidePartnerModal() {
    document.getElementById('partnerModal').classList.remove('show');
}

function copyPairCode() {
    const code = document.getElementById('myPairCode').value;
    if (code && code !== '未連線') {
        navigator.clipboard.writeText(code).then(() => showToast('配對碼已複製'));
    }
}

async function linkPartner() {
    const partnerCode = document.getElementById('partnerCodeInput').value.trim().toUpperCase();
    if (!partnerCode || partnerCode.length < 4) {
        showToast('請輸入對方的配對碼');
        return;
    }

    // Block self-pairing
    const myCode = document.getElementById('myPairCode').value;
    if (partnerCode === myCode) {
        document.getElementById('partnerStatus').innerHTML = '⚠️ 這是你自己的配對碼，請輸入對方的';
        return;
    }

    try {
        const doc = await db.collection('pairCodes').doc(partnerCode).get();
        if (doc.exists) {
            const partnerUid = doc.data().uid;

            // Extra check: don't pair with self even if code differs somehow
            if (partnerUid === FirebaseSync.userId) {
                document.getElementById('partnerStatus').innerHTML = '⚠️ 這是你自己的帳號，請輸入對方的配對碼';
                return;
            }

            localStorage.setItem('zeju_partner_code', partnerCode);
            localStorage.setItem('zeju_partner_uid', partnerUid);

            // Also store in own user doc
            await db.collection('users').doc(FirebaseSync.userId).set({
                partnerId: partnerUid,
                partnerCode: partnerCode
            }, { merge: true });

            document.getElementById('partnerStatus').innerHTML = '✅ 配對成功！重新整理頁面即可看到對方進度';
            showPartnerModalPairedState(partnerCode);
            showToast('配對成功！');

            // Load partner progress
            loadPartnerProgress(partnerUid);
        } else {
            document.getElementById('partnerStatus').innerHTML = '❌ 找不到這個配對碼，請確認對方已開啟過這個頁面';
        }
    } catch(e) {
        console.warn('配對失敗', e);
        document.getElementById('partnerStatus').innerHTML = '❌ 配對失敗，請稍後再試';
    }
}

function showPartnerModalPairedState(code) {
    const inputArea = document.getElementById('partnerInputArea');
    if (inputArea) {
        inputArea.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#F0F5F0;border:1px solid #C8DFC8;border-radius:8px;">
                <span style="font-size:13px;color:#555;">已與 <strong style="font-family:monospace;letter-spacing:1px;">${code}</strong> 配對中</span>
                <button onclick="unlinkPartner()" style="font-size:12px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;">解除配對</button>
            </div>`;
    }
}

async function unlinkPartner() {
    localStorage.removeItem('zeju_partner_code');
    localStorage.removeItem('zeju_partner_uid');

    // Remove from Firestore
    if (FirebaseSync.userId) {
        try {
            await db.collection('users').doc(FirebaseSync.userId).update({
                partnerId: firebase.firestore.FieldValue.delete(),
                partnerCode: firebase.firestore.FieldValue.delete()
            });
        } catch(e) { console.warn('解除配對 Firestore 更新失敗', e); }
    }

    // Clear partner badges from UI
    document.querySelectorAll('.partner-badge').forEach(b => b.remove());

    // Reset partner hint
    const hint = document.getElementById('partnerHint');
    if (hint) {
        hint.classList.remove('linked');
        hint.querySelector('.partner-hint-text').innerHTML = '買房是兩個人的決定？<strong>開啟雙人模式</strong>，看到彼此的進度。';
    }

    showToast('已解除配對');
    hidePartnerModal();
}

async function loadPartnerProgress(partnerUid) {
    if (!partnerUid) return;
    const partnerData = await FirebaseSync.getPartner(partnerUid);
    if (partnerData && partnerData.steps) {
        renderPartnerOverlay(partnerData);
    }
}

function renderPartnerOverlay(partnerState) {
    // Add subtle partner indicators on each step card
    Object.keys(STEPS).forEach(stepId => {
        const card = document.getElementById('step-' + stepId);
        if (!card) return;
        const partnerStep = partnerState.steps && partnerState.steps[stepId];
        if (!partnerStep) return;

        let badge = card.querySelector('.partner-badge');
        if (!badge) {
            badge = document.createElement('span');
            badge.className = 'partner-badge';
            badge.style.cssText = 'position:absolute;top:8px;right:8px;font-size:11px;opacity:0.8;';
            card.appendChild(badge);
        }

        if (partnerStep.status === 'clear') {
            badge.textContent = '🤝✅';
            badge.title = '對方已想清楚';
        } else if (partnerStep.status === 'thinking') {
            badge.textContent = '🤝🔄';
            badge.title = '對方正在想';
        } else {
            badge.textContent = '';
        }
    });
}

// On page load, check for saved partner
(function checkPartner() {
    const partnerUid = localStorage.getItem('zeju_partner_uid');
    if (partnerUid) {
        // Update hint to show linked state
        const hint = document.getElementById('partnerHint');
        if (hint) {
            hint.classList.add('linked');
            hint.querySelector('.partner-hint-text').innerHTML = '已配對 🤝 <strong>雙人模式運作中</strong>，你們可以看到彼此的進度。';
        }
        if (FirebaseSync.initialized) {
            setTimeout(() => loadPartnerProgress(partnerUid), 2000);
        }
    }
})();

// Initialize Lucide icons (for nav hamburger menu)
if (typeof lucide !== 'undefined') lucide.createIcons();
